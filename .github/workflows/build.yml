name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # O google-services.json não fica no Git. Guarde-o em base64 no secret GOOGLE_SERVICES_JSON.
      - name: Criar google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::Crie o secret GOOGLE_SERVICES_JSON (conteúdo do google-services.json em base64)."
            exit 1
          fi
          echo "$GS_JSON" | base64 -d > app/google-services.json

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ChildrenLocation-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publica o APK como pré-lançamento (só quando o workflow é executado manualmente).
      - name: Publicar pré-lançamento
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.0-pre.${{ github.run_number }}"
          cp app/build/outputs/apk/debug/app-debug.apk "ChildrenLocation-0.2-debug.apk"
          gh release create "$TAG" "ChildrenLocation-0.2-debug.apk" \
            --prerelease \
            --title "Children Location 0.2 (pré-lançamento)" \
            --notes "Beta 0.2: só adultos têm conta (e-mail ou Google); a criança entra escaneando o QR. Famílias, convite de outros adultos, aprovação pelo painel de administração, assinatura fixa (atualiza por cima). APK de teste (chave de debug)."
