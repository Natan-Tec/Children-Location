name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # O google-services.json não fica no Git. Guarde-o em base64 no secret GOOGLE_SERVICES_JSON.
      - name: Criar google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "::error::Crie o secret GOOGLE_SERVICES_JSON (conteúdo do google-services.json em base64)."
            exit 1
          fi
          echo "$GS_JSON" | base64 -d > app/google-services.json

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ChildrenLocation-debug-apk
          path: app/build/outputs/apk/debug/*.apk
